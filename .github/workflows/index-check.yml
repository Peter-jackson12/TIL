name: TIL Index Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  index-check:
    name: Generated index is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check generated indexes
        run: python tools/build_index.py --check
